name: Build

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-odoo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ODOOVERSION:
          - "14.0"
          - "14.0-light"
          - "15.0"
          - "16.0"
          - "16.0-light"
          - "17.0"
          - "17.0-light"
          - "18.0"
          - "18.0-light"
          - "19.0-light"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ matrix.ODOOVERSION }}-latest
            type=raw,value=${{ matrix.ODOOVERSION }}-${{ github.sha }},enable=${{ github.event_name == 'push' }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.ODOOVERSION }}/Dockerfile
          pull: true
          push: true
          # cache only on commit, for refresh on schedule rebuild everything 
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
